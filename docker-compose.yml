services:
  postgres:
    image: postgres:16-alpine
    container_name: dailytaka-postgres
    environment:
      POSTGRES_USER: dailytaka
      POSTGRES_PASSWORD: dailytaka
      POSTGRES_DB: dailytaka
    ports:
      - "5432:5432"
    volumes:
      - dailytaka_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailytaka -d dailytaka"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dailytaka-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dailytaka_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  dailytaka_pg_data:
  dailytaka_minio_data:
